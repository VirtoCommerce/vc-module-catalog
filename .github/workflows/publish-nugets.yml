# v3.1000.7
# https://virtocommerce.atlassian.net/browse/VCST-6642
name: Publish nuget

on:
  workflow_dispatch:
    inputs:
      publishAlpha:
        description: 'Publish nuget as alpha version.'
        required: true
        default: true
        type: boolean

# Least-privilege default; jobs override below where they need more.
permissions:
  contents: read

jobs:
  test:
    uses: VirtoCommerce/.github/.github/workflows/test-and-sonar.yml@v3.1000.7
    secrets:
      sonarToken: ${{ secrets.SONAR_TOKEN }}

  build:
    uses: VirtoCommerce/.github/.github/workflows/build.yml@v3.1000.7
    with:
      uploadPackage: 'true'
      uploadDocker: 'false'
      forceVersionSuffix: ${{ github.event.inputs.publishAlpha }}
    secrets:
      envPAT: ${{ secrets.REPO_TOKEN }}

  # Trusted Publishing: vc-nuget-publisher holds the one nuget.org policy and pushes the packages.
  # The push can't run in a cross-repo reusable workflow (job_workflow_ref wouldn't match any policy — NuGet/login issues #6/#9).
  publish-nuget:
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Reuse the package built by the `build` job (same cache key/path it wrote).
      - name: Get package from cache
        id: restore-build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.build.outputs.packageFullKey }}
          path: |
            ${{ github.workspace }}/artifacts
            ${{ github.workspace }}/publish

      - name: Exit if cache not restored
        if: steps.restore-build.outputs.cache-hit != 'true'
        env:
          FULL_KEY: ${{ needs.build.outputs.packageFullKey }}
        run: |
          echo "::error::Package cache not found for key ${FULL_KEY}"
          exit 1

      - name: Publish Nuget
        # Bounds the wait for the publisher run; a normal publish takes under a minute.
        timeout-minutes: 30
        uses: VirtoCommerce/.github/actions/publish-nuget-central@v3.1000.7
        with:
          githubToken: ${{ secrets.REPO_TOKEN }}

  # Blob upload + PR-body link. forceNuget: false — the push is done by publish-nuget above.
  # publish-github.yml edits the PR via the passed GITHUB_TOKEN — grant write to both.
  publish-blob:
    needs: [build, test, publish-nuget]
    permissions:
      contents: write
      pull-requests: write
    uses: VirtoCommerce/.github/.github/workflows/publish-github.yml@v3.1000.7
    with:
      fullKey: ${{ needs.build.outputs.packageFullKey }}
      forceGithub: false
      forceNuget: false
      forceBlob: true
    secrets:
      envPAT: ${{ secrets.GITHUB_TOKEN }}
      BLOB_TOKEN: ${{ secrets.BLOB_TOKEN }}
