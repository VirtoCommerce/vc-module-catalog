# v3.1000.8
# https://virtocommerce.atlassian.net/browse/VCST-6642
name: Release hotfix

on:
  workflow_dispatch:
    inputs:
      incrementPatch:
        description: 'Increment patch version.'
        required: true
        default: true
        type: boolean

# Least-privilege default; jobs override below where they need more.
permissions:
  contents: read

jobs:
  test:
    uses: VirtoCommerce/.github/.github/workflows/test-and-sonar.yml@v3.1000.8
    secrets:
      sonarToken: ${{ secrets.SONAR_TOKEN }}

  build:
    uses: VirtoCommerce/.github/.github/workflows/build.yml@v3.1000.8
    with:
      uploadPackage: 'true'
      uploadDocker: 'false'
      forceVersionSuffix: 'false'
      incrementPatch: ${{ github.event.inputs.incrementPatch }}
    secrets:
      envPAT: ${{ secrets.REPO_TOKEN }}

  get-metadata:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Get Changelog
      id: changelog
      uses: VirtoCommerce/.github/actions/changelog-generator@v3.1000.8

  # Trusted Publishing: vc-nuget-publisher holds the one nuget.org policy and pushes the packages.
  # The push can't run in a cross-repo reusable workflow (job_workflow_ref wouldn't match any policy — NuGet/login issues #6/#9).
  # needs get-metadata too: a metadata failure must block the push, else the package publishes while
  # publish-github-release (which needs get-metadata) is skipped — package with no GitHub release.
  publish-nuget:
    needs: [build, test, get-metadata]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Reuse the package built by the `build` job (same cache key/path it wrote).
      - name: Get package from cache
        id: restore-build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.build.outputs.packageFullKey }}
          path: |
            ${{ github.workspace }}/artifacts
            ${{ github.workspace }}/publish

      - name: Exit if cache not restored
        if: steps.restore-build.outputs.cache-hit != 'true'
        env:
          FULL_KEY: ${{ needs.build.outputs.packageFullKey }}
        run: |
          echo "::error::Package cache not found for key ${FULL_KEY}"
          exit 1

      - name: Publish Nuget
        # Bounds the wait for the publisher run; a normal publish takes under a minute.
        timeout-minutes: 30
        uses: VirtoCommerce/.github/actions/publish-nuget-central@v3.1000.8
        with:
          githubToken: ${{ secrets.REPO_TOKEN }}

  # GitHub release only. forceNuget: false — the push is done by publish-nuget above.
  # publish-github.yml creates the release + edits the PR via the passed GITHUB_TOKEN — grant write to both.
  publish-github-release:
    permissions:
      contents: write
      pull-requests: write
    needs:
      [build, test, get-metadata, publish-nuget]
    uses: VirtoCommerce/.github/.github/workflows/publish-github.yml@v3.1000.8
    with:
      fullKey: ${{ needs.build.outputs.packageFullKey }}
      changeLog: '${{ needs.get-metadata.outputs.changeLog }}'
      incrementPatch: ${{ github.event.inputs.incrementPatch }}
      forceNuget: false
      makeLatest: 'false'

    secrets:
      envPAT: ${{ secrets.GITHUB_TOKEN }}

  increment-version:
    needs:
      [publish-github-release]
    if: ${{ github.event.inputs.incrementPatch == 'true' }}
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install VirtoCommerce.GlobalTool
      uses: VirtoCommerce/.github/actions/setup-vcbuild@v3.1000.8

    - name: Setup Git Credentials
      uses: VirtoCommerce/.github/actions/setup-git-credentials-github@v3.1000.8
      with:
        githubToken: ${{ secrets.REPO_TOKEN }}

    - name: Increment Version
      run: |
        vc-build IncrementPatch
        git add Directory.Build.props *module.manifest
        git commit -m "ci: Auto IncrementPatch"
        git push
